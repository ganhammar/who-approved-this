name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  deploy:
    # arm64 runner: the Native AOT publishes below compile natively for the
    # linux-arm64 Lambda and container targets, no cross-compilation, no QEMU
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The Lambda binary must link against glibc 2.34 (provided.al2023);
      # Ubuntu 24.04 ships 2.39, so the link step goes through zig cc with a
      # pinned glibc target instead of the system toolchain
      - name: Install zig as the Lambda link toolchain
        run: |
          curl -sSL https://ziglang.org/download/0.14.0/zig-linux-aarch64-0.14.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-aarch64-0.14.0" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/zigcc" <<'EOF'
          #!/usr/bin/env bash
          # zig links through its own lld and rejects a few flags ILC passes
          # --gc-sections is dropped because lld would GC ILC's __modules
          # section, which is referenced only via linker-synthesized
          # __start_/__stop_ boundary symbols; the binary gets a bit larger
          args=()
          for arg in "$@"; do
            case "$arg" in
              -pie|-Wl,-pie|-fuse-ld=*|-gz=*|-Wl,--gc-sections) ;;
              *) args+=("$arg") ;;
            esac
          done
          exec zig cc -target aarch64-linux-gnu.2.34 -Wl,--undefined-version "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/zigcc"

      - name: Publish MCP server and agent (linux-arm64 AOT, in parallel)
        run: |
          dotnet publish src/WhoApprovedThis.McpServer -c Release -r linux-arm64 \
            -p:CppCompilerAndLinker="$RUNNER_TEMP/zigcc" & mcp=$!
          dotnet publish src/WhoApprovedThis.Agent -c Release -r linux-arm64 \
            -o src/WhoApprovedThis.Agent/publish & agent=$!
          status=0
          wait $mcp || status=1
          wait $agent || status=1
          mkdir -p artifacts/mcp-server
          cp src/WhoApprovedThis.McpServer/bin/Release/net10.0/linux-arm64/publish/WhoApprovedThis.McpServer \
            artifacts/mcp-server/bootstrap
          exit $status

      # provided.al2023 ships glibc 2.34; fail the build if the binary
      # requires anything newer
      - name: Verify bootstrap glibc requirements
        run: |
          max=$(objdump -T artifacts/mcp-server/bootstrap | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "Highest required: $max (runtime provides GLIBC_2.34)"
          [ "$(printf 'GLIBC_2.34\n%s\n' "$max" | sort -V | tail -1)" = "GLIBC_2.34" ]

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: CDK deploy
        run: npx aws-cdk@latest deploy --require-approval never --outputs-file outputs.json

      - name: Post-deploy wiring
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: ./scripts/postdeploy.sh outputs.json
