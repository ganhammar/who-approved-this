<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>who-approved-this</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { max-width: 40rem; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; height: 100dvh; box-sizing: border-box; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    h1 { font-size: 1.1rem; }
    #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; padding: .5rem 0; }
    .msg { padding: .5rem .75rem; border-radius: .75rem; max-width: 85%; white-space: pre-wrap; overflow-wrap: break-word; }
    .you { align-self: flex-end; background: #2563eb; color: white; }
    .agent { align-self: flex-start; background: color-mix(in srgb, currentColor 12%, transparent); }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem .75rem; border-radius: .75rem; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); font: inherit; background: transparent; color: inherit; }
    button { padding: .6rem 1rem; border-radius: .75rem; border: none; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    #user { display: flex; gap: .75rem; align-items: center; }
    .ghost { background: transparent; color: inherit; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); padding: .3rem .7rem; opacity: .7; }
    a { color: #2563eb; }
    [hidden] { display: none !important; }
    #splash { flex: 1; display: grid; place-items: center; opacity: .6; }
    .pending span { display: inline-block; width: .5em; height: .5em; margin-right: .25em; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
    .pending span:nth-child(2) { animation-delay: .2s; }
    .pending span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: .8; } }
  </style>
</head>
<body>
  <header id="header" hidden>
    <h1>who-approved-this</h1>
    <span id="user">
      <span id="who"></span>
      <button id="logout" class="ghost">Log out</button>
    </span>
  </header>
  <div id="splash">Signing you in&hellip;</div>
  <div id="chat" hidden></div>
  <form id="form" hidden>
    <input id="prompt" placeholder="e.g. Submit a coffee expense for 45 SEK" autocomplete="off">
    <button>Send</button>
  </form>
  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
